name: UI Validation Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  generate-and-run-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for commit messages
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps
      
      - name: Extract PR commit messages
        id: extract-commits
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            
            echo "PR Number: $PR_NUMBER"
            echo "Base SHA: $BASE_SHA"
            echo "Head SHA: $HEAD_SHA"
            
            # Get commit messages from PR
            COMMIT_MESSAGES=$(git log --pretty=format:"%s" $BASE_SHA..$HEAD_SHA)
            echo "COMMIT_MESSAGES<<EOF" >> $GITHUB_OUTPUT
            echo "$COMMIT_MESSAGES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            
            # Save commit messages to file for test generation
            echo "$COMMIT_MESSAGES" > commit_messages.txt
          else
            # For manual dispatch, use last 5 commits
            COMMIT_MESSAGES=$(git log --pretty=format:"%s" -5)
            echo "$COMMIT_MESSAGES" > commit_messages.txt
          fi
      
      - name: Generate UI tests from commit messages
        run: |
          python3 scripts/generate_ui_tests.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      
      - name: Run Playwright tests
        run: |
          npx playwright test tests/playwright/generated/
        continue-on-error: true
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      
      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let comment = '## UI Validation Test Results\n\n';
            
            // Check if test results exist
            if (fs.existsSync('playwright-report/index.html')) {
              comment += '✅ Tests completed. See artifacts for detailed report.\n\n';
            } else {
              comment += '⚠️ Test execution completed. Check logs for details.\n\n';
            }
            
            // Add commit message analysis
            if (fs.existsSync('commit_messages.txt')) {
              const messages = fs.readFileSync('commit_messages.txt', 'utf8');
              comment += '### Commit Messages Analyzed:\n';
              comment += '```\n' + messages + '\n```\n\n';
            }
            
            comment += '---\n*Generated by UI Validation workflow*';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
